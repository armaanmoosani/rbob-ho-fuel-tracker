name: Daily Price Ingestion

on:
  schedule:
    - cron: '0 0,1,2,3,4,5,13,14 * * 2-6' # Runs hourly from 7:00 PM to 12:00 AM CT (Mon-Fri evenings) and at 8:00 AM CT (Mon-Fri mornings) to retry ingestion
  workflow_dispatch:

concurrency:
  group: rbob-tracker
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ingest Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GRAVES_EMAIL: ${{ secrets.GRAVES_EMAIL }}
          GRAVES_APP_PASSWORD: ${{ secrets.GRAVES_APP_PASSWORD }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          # Optional: allow passing settlement snapshots via secrets (env override)
          SETTLE_SNAPSHOT_RB: ${{ secrets.SETTLE_SNAPSHOT_RB }}
          SETTLE_SNAPSHOT_HO: ${{ secrets.SETTLE_SNAPSHOT_HO }}
          # Optional ThinkOrSwim endpoints/secrets
          TOS_SETTLEMENT_URL: ${{ secrets.TOS_SETTLEMENT_URL }}
          TOS_API_KEY: ${{ secrets.TOS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python ingest_prices.py

