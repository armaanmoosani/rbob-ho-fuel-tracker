name: Daily Price Ingestion

on:
  schedule:
    # Evening ingestion, hourly.  UTC hours 0-6 cover 7:00 PM - 1:00 AM CT under
    # CDT and 6:00 PM - midnight CT under CST, so the post-midnight retry
    # survives the winter shift.  The previous range (0-5) lost the midnight
    # hour for the five months the US is on CST.
    #
    # Day-of-week 2-6 is Tue-Sat in UTC, which is Mon-Fri *evening* in CT --
    # a Monday 8 PM CT run is already Tuesday in UTC.
    #
    # UTC 13-14 is 8:00-9:00 AM CT the next morning.  ingest_prices targets the
    # previous day before noon, so the Tue-Sat window retries Mon-Fri sessions;
    # Monday morning is correctly absent because it would target Sunday.
    - cron: '0 0,1,2,3,4,5,6,13,14 * * 2-6'
  workflow_dispatch:

concurrency:
  group: rbob-tracker
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ingest Script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GRAVES_EMAIL: ${{ secrets.GRAVES_EMAIL }}
          GRAVES_APP_PASSWORD: ${{ secrets.GRAVES_APP_PASSWORD }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          # Optional: allow passing settlement snapshots via secrets (env override)
          SETTLE_SNAPSHOT_RB: ${{ secrets.SETTLE_SNAPSHOT_RB }}
          SETTLE_SNAPSHOT_HO: ${{ secrets.SETTLE_SNAPSHOT_HO }}
          # Optional ThinkOrSwim endpoints/secrets
          TOS_SETTLEMENT_URL: ${{ secrets.TOS_SETTLEMENT_URL }}
          TOS_API_KEY: ${{ secrets.TOS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python ingest_prices.py

