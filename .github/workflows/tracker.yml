name: RBOB Fuel Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_verdict:
        description: 'Force a Final Verdict recommendation now (On-Demand)'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # The tracker has its own group, separate from the data workflows.
  #
  # All four workflows previously shared "rbob-tracker" to serialise git
  # pushes.  The side effect was that a nightly ingest -- which runs the full
  # calibration and takes minutes -- blocked every tracker dispatch for its
  # duration, and because only one run per group may be pending, the queued
  # tracker runs cancelled each other.  On 2026-10-05 that turned a GitHub
  # runner shortage into a cascade of failure/cancelled/cancelled across the
  # 2:35 PM CT verdict window, and no verdict was produced that day.
  #
  # Push safety no longer depends on this: the persist step below pulls with
  # rebase and retries, and ingest_prices/backtest do their own pull-rebase.
  group: rbob-tracker-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Script
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FORCE_VERDICT: ${{ github.event.inputs.force_verdict }}
        run: python main.py

      - name: Persist live prediction and settlement provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_log.csv
          [ -f data/daily_settlement.json ] && git add data/daily_settlement.json || true
          if git diff --cached --quiet; then
            echo "Nothing to persist."
            exit 0
          fi
          git commit -m "Record live fuel provenance"
          # Retry the rebase/push: now that this workflow has its own
          # concurrency group it can race the data workflows, and a lost race
          # must not fail the job -- the alert has already been sent by this
          # point, so only the log row is at stake.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Persisted on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying in $((attempt * 5))s."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not persist the prediction log after 5 attempts; the alert was already sent, only the log row is missing."
          exit 0
