name: RBOB Fuel Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_verdict:
        description: 'Force a Final Verdict recommendation now (On-Demand)'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  run-tracker:
    # Serialize only the primary job. A queued/slow shadow worker must not
    # hold the tracker lock and delay subsequent purchasing alerts.
    concurrency:
      group: rbob-tracker-live
      cancel-in-progress: false
    outputs:
      shadow_date: ${{ steps.shadow_request.outputs.session_date }}
    # Pinned rather than ubuntu-latest: GitHub migrates that label to
    # Ubuntu 26 on 2026-10-19, which would change the base image under a
    # live pipeline with no warning. Pin deliberately and move when tested.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Script
        env:
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FORCE_VERDICT: ${{ github.event.inputs.force_verdict }}
          SHADOW_REQUEST_FILE: ${{ runner.temp }}/rb-shadow-request
        run: python main.py

      - name: Persist live prediction and settlement provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_log.csv
          [ -d data/shadow/inputs ] && git add data/shadow/inputs || true
          [ -f data/daily_settlement.json ] && git add data/daily_settlement.json || true
          if git diff --cached --quiet; then
            echo "Nothing to persist."
            exit 0
          fi
          git commit -m "Record live fuel provenance"
          # Retry the rebase/push: now that this workflow has its own
          # concurrency group it can race the data workflows, and a lost race
          # must not fail the job -- the alert has already been sent by this
          # point, so only the log row is at stake.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Persisted on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying in $((attempt * 5))s."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not persist the prediction log after 5 attempts; the alert was already sent, only the log row is missing."
          exit 0

      - name: Read sealed shadow request
        id: shadow_request
        run: |
          if [ -f "$RUNNER_TEMP/rb-shadow-request" ]; then
            session_date=$(cat "$RUNNER_TEMP/rb-shadow-request")
            echo "session_date=$session_date" >> "$GITHUB_OUTPUT"
          fi

  shadow:
    needs: run-tracker
    if: ${{ needs.run-tracker.outputs.shadow_date != '' }}
    uses: ./.github/workflows/shadow_trial.yml
    with:
      session_date: ${{ needs.run-tracker.outputs.shadow_date }}
